name: compatibility

on:
  push:
  pull_request:

jobs:
  vm:
    name: VM (mobile/desktop Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test

  web:
    name: Chrome (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test -d chrome test/one_request_platform_test.dart test/one_request_unit_test.dart test/one_socket_test.dart test/one_connectivity_test.dart
