name: one_request
description: Flutter HTTP, optional WebSocket, and optional connectivity notices. One import; every feature can be skipped or turned off.
version: 3.1.0
homepage: https://github.com/snigdho48/one_request
repository: https://github.com/snigdho48/one_request/
issue_tracker: https://github.com/snigdho48/one_request/issues/
topics:
  - http
  - dio
  - websocket
  - network
  - rest
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  dart_either: ^2.3.0
  flutter_easyloading: ^4.0.2
  logging: ^1.3.0
  vector_math: ^2.2.0
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
